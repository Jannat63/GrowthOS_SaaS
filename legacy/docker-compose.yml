# GrowthOS local dev stack — Section 6.1 / 6.3
# Run: docker compose up --build
# Then hit the gateway at http://localhost:8000, or the app directly at http://localhost:3000
#
# NOTE ON PORT 3000: this "web" container and a locally-run `npm run dev`
# (see apps/web) both default to port 3000 — don't run both at once, or the
# second one to start will fail to bind the port. Pick one workflow: either
# run everything via this compose file, or stop the "web" container
# (docker compose stop web) and run the frontend locally with `npm run dev`
# against the same backend services.

services:
  postgres:
    # Uses the vanilla postgres:16 image, but migration 001_core_schema.sql
    # runs `CREATE EXTENSION IF NOT EXISTS "vector"` — that extension isn't
    # in the stock image, so initialization fails and the container exits,
    # which cascades into every dependent service failing too. Confirmed by
    # actually running this compose file, not just inspecting it. Fixed by
    # switching to the pgvector-enabled image, which is a drop-in replacement
    # (same Postgres, same env vars) with the extension pre-installed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: growthos
      POSTGRES_USER: growthos
      POSTGRES_PASSWORD: growthos
    ports: ["5432:5432"]
    volumes:
      - ./db/postgres/migrations:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthos -d growthos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ./db/clickhouse/schema:/docker-entrypoint-initdb.d

  auth-service:
    build: ./services/auth-service
    ports: ["8006:8006"]
    environment:
      DATABASE_URL: postgresql://growthos:growthos@postgres:5432/growthos
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  seo-service:
    build: ./services/seo-service
    ports: ["8001:8001"]
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://growthos:growthos@postgres:5432/growthos
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  google-ads-service:
    build: ./services/google-ads-service
    ports: ["8002:8002"]
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}

  meta-ads-service:
    build: ./services/meta-ads-service
    ports: ["8003:8003"]

  intelligence-service:
    build: ./services/intelligence-service
    ports: ["8004:8004"]
    environment:
      DATABASE_URL: postgresql://growthos:growthos@postgres:5432/growthos
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    ports: ["8005:8005"]

  api-gateway:
    build: ./services/api-gateway
    ports: ["8000:8000"]
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # Docker Compose resolves these via its internal DNS to the actual
      # sibling containers — "localhost" would NOT work here (see the fix
      # note in services/api-gateway/index.js for why).
      AUTH_SERVICE_URL: http://auth-service:8006
      SEO_SERVICE_URL: http://seo-service:8001
      GOOGLE_ADS_SERVICE_URL: http://google-ads-service:8002
      META_ADS_SERVICE_URL: http://meta-ads-service:8003
      INTELLIGENCE_SERVICE_URL: http://intelligence-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    depends_on:
      - auth-service
      - seo-service
      - google-ads-service
      - meta-ads-service
      - intelligence-service
      - notification-service

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api-gateway]

volumes:
  postgres_data:
