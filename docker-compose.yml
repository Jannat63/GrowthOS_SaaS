# GrowthOS — local dev infrastructure (D3: run free/local in dev)
# Brings up the data services the Python worker (apps/worker, M2 P2.1) depends on.
# Usage:
#   docker compose up -d          # start
#   docker compose ps             # status
#   docker compose down           # stop (keeps volumes)
#   docker compose down -v        # stop + wipe data

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: growthos-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Schema auto-loads on first init (empty data volume) only.
      - ./infra/clickhouse/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: growthos-redis
    ports:
      - "6379:6379"   # native Redis protocol — job-bridge for Fastify → the Python worker, plus the
                      # WebSocket relay and the scheduler's single-runner locks. (BullMQ/Celery were
                      # the original plan; M2 P2.1 replaced both with a plain JSON envelope.)
    command: ["redis-server", "--appendonly", "yes"]   # persist to disk (AOF)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  clickhouse-data:
  redis-data:
